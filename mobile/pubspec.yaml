# Espace de travail Dart (pub workspaces) : une seule résolution de dépendances pour les 2 applications
# et les 3 paquets partagés. Commandes depuis ce dossier : `flutter pub get`, `dart run tool/check.dart`.
name: ineed_mobile
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - apps/client
  - apps/pro
  - packages/ineed_core
  - packages/ineed_ui
  - packages/ineed_shared
  - packages/ineed_api
dev_dependencies:
  flutter_lints: 6.0.0

# Politique de versions : uniquement des versions publiées depuis au moins 14 jours, dépendances indirectes
# comprises (vérifié par tool/check_pub_age.py en CI). Ces dépendances indirectes sont ramenées à la version
# précédente le temps que leur dernière version atteigne ce délai.
dependency_overrides:
  android_file_picker: 2.1.0
  crypto: 3.0.7
  cupertino_ui: 1.1.3
  file_picker_darwin: 2.3.1
  file_picker_web: 4.1.0
  file_selector_macos: 0.9.5+1
  frontend_server_client: 4.1.0
  geolocator_android: 5.1.1+1
  geolocator_apple: 2.3.15
  geolocator_platform_interface: 4.4.0
  http_multi_server: 3.2.2
  image_picker_ios: 0.8.13+12
  jni: 1.1.0
  material_ui: 1.7.0
  posix: 6.5.2
  shelf: 1.4.2
  shelf_static: 1.1.3
  vector_graphics: 1.2.3
  vector_graphics_compiler: 1.3.1
  vector_math: 2.4.3
  vm_service: 15.3.0
  web: 1.1.1
