name: ineed_ui
description: Système de design Ineed pour Flutter (tokens générés, thèmes clair et sombre, composants).
publish_to: none
version: 0.3.0
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
